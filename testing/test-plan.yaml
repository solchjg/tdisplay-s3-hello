# ── Capabilities ─────────────────────────────────────────────────────────
# Bench capabilities: `yes` as the bench declares them (Harness FSD); a
# project never proves the bench. Project-side equipment: `unproven` until
# /commission observes it working here — each one is a debugging-agenda item.
capabilities:
  bench-flash:
    what: Flash an image set to SLOT4 over USB (Harness /api/flash)
    available: yes
    # Usage notes (2026-10-23): upload the artefact's flash_args file with the
    # parts (tests/bench/conftest.py does). Even then the bench flashes 40 MHz
    # and keeps the flash size: pi/portal.py's flash_args parser reads only
    # the first option of a line, and ESP-IDF writes all three on one line
    # (DUT boot: "Boot SPI Speed : 40MHz" for an 80m build, fw 0.0.0-41110fb).
    # Bench fault filed: SensorsIot/Embedded-AI-Harness#52. No FSD clause states
    # a flash clock, so nothing here is blocked.
    # /api/chip/info is logged as "flash(SLOT4)": filed as #53.
    # /api/chip/info runs esptool and appears in the activity log as
    # "flash(SLOT4)" with about 665 bytes of output (02:47:11Z, 03:04:14Z); it
    # reads identity and does not write an image.
  bench-serial-monitor:
    what: Read SLOT4 serial with pattern wait, DTR/RTS held low (Harness serial monitor)
    available: yes
    # Usage note carried from esp32-oled-hello: a `^`-anchored pattern did not
    # match lines the monitor itself returned; use unanchored patterns.
    # Usage note (2026-10-23): a monitor running when the bench serial reset
    # is issued ends at once with "timeout, no match" (log 03:02:53Z), so it
    # cannot catch a one-shot boot line across a reset. Read the boot capture
    # that the serial reset returns, or match a periodic line.
  bench-usb-reset:
    what: Reset the DUT in SLOT4 over USB-Serial/JTAG (Harness serial reset)
    available: yes
    # Usage note (2026-10-23): on this native-USB S3 the DTR/RTS reset resets the
    # chip a second time ~3.4 s after its 5 s capture, when the bench reopens
    # the port (pi/portal.py serial_reset -> start_proxy). The capture shows
    # boot B; the board then runs boot C, whose first ~1 s nobody reads
    # (raw dump: testing/evidence/runs/slot4-double-reset-ring.json). Fine for
    # "what does a boot print"; wrong for any no-reset window. Bench fault:
    # SensorsIot/Embedded-AI-Harness#47 (reproduction and code path commented).
  bench-jtag-reset:
    what: Reset SLOT4 through its built-in USB-JTAG in a debug session, keeping the serial proxy up (Harness debug + serial reset)
    available: yes
    # One boot, lines live in the ring with bench timestamps; the 5 s capture
    # is re-pushed as a block sharing one timestamp (conftest.reset_and_follow).
  bench-operator-prompt:
    what: Blocking operator prompt with yes/no answer and timestamp (Harness human interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the bench web UI
    available: yes
  bench-wifi-scan:
    what: WiFi scan from the bench radio (for FR-9.1 air check)
    available: yes
  bench-ble-scan:
    what: BLE scan from the bench (for FR-9.1 air check)
    available: yes
  slot4-gpio-reset:
    what: EN/BOOT reset and download mode via bench GPIO on SLOT4
    available: no
    # Bench reports gpio_wired=false for SLOT4 (EN pulse produced no reset).
    # Consequence: no GPIO recovery of a crash-looping or wedged DUT; recovery
    # is USB reset, or an operator holding BOOT (GPIO 0) while replugging USB-C.
  bench-wifi-scan-bssid:
    what: WiFi scan that reports each network's BSSID, so the DUT's MAC can be recognised (FR-9.1 air, WiFi half)
    available: no
    # /api/wifi/scan returns ssid, rssi, auth, channel only (2026-10-23).
    # Consequence: TC-SEC-03 matches the default SoftAP SSID instead (FSD 0.1.2,
    # R-6); FR-9.1's air check otherwise stands on BLE plus
    # the host-tier symbol check. Bench gap: SensorsIot/Embedded-AI-Harness#50.
  seam-lcd-fault-injection:
    what: "Test build whose LCD interface returns a chosen esp_err_t at init or the k-th draw, logging `lcdfi: call` (FSD §5.5)"
    available: yes
    # Built 2026-10-23: tests/target/lcd_fault/, CI job lcd-fault (variants init, write5).
  release-verification:
    what: Tag-triggered journey run against the released artifact
    available: yes
    # The devcontainer runs 24/7; the bench may not. An absent bench at
    # verify time is an unmet precondition (not done), never a failure.
  dut-tdisplay-s3-slot4:
    what: The board in SLOT4 is a T-Display-S3 with 16 MB flash; a CI-built image flashes over USB and its log reaches SLOT4's monitor
    available: yes
    observed: 2026-10-23
    evidence: >
      /api/chip/info SLOT4: ESP32-S3 (QFN56) v0.1, 8MB embedded PSRAM, flash
      0xef/0x4018 detected 16MB, MAC 34:85:18:71:c7:34 (matches FSD §2.2 / C-10.3).
      CI run 39891554233 (Commissioning aids, commit of commissioning/) artifact
      `forward-path`, flashed via /api/flash at its flash_args offsets 0x0
      bootloader, 0x8000 partition table, 0x10000 app (3 hashes verified);
      serial monitor matched `OFF` in the ON/OFF stream at 02:51:43Z.
      Boot marker: CI run 39892563917 (Build Firmware, commit 1de3851) artifact
      `firmware-v0.0.0-1de3851` coldflash set, flashed at the offsets in its
      flash_args, 0x0 / 0x8000 / 0x10000, at 03:02:44Z (sent as per-offset
      parts without the flash_args file, so the bench used its 40 MHz default
      and not the build's 80m; boot capture shows SPI speed 40MHz) (3 hashes verified; sha256
      bootloader 0d9a5c9b…097f, partition-table 7f00b6c0…c820, tdisplay_hello
      a4ab669d…fee). The boot capture of the bench serial reset at 03:03:25Z
      shows `App version: 0.0.0-1de3851` and
      `I (135) main: Init complete, running event-driven`. The raw, unedited
      /api/serial/reset response is committed as
      testing/evidence/commissioning-2026-10-23/slot4-serial-reset-0303Z.json
      (the bench log keeps only "serial.reset(SLOT4) — done").
      The monitor attempt it replaced is slot4-monitor-cut-by-reset-0302Z.json.
      Aid hashes (run 39891554233): forward_path.bin c1cdbb64…, lcd_probe.bin 3678fdbf….
      Board identity as a T-Display-S3 (not only an ESP32-S3) is shown by
      `lcd-st7789`: its built-in panel answers on the T-Display-S3 pin map.
  lcd-st7789:
    what: The built-in ST7789 lights correctly with the FSD §2.2 pin map, GPIO 15 power, GPIO 38 backlight, 10 MHz i80 clock and offset 35
    available: yes
    observed: 2026-10-23
    evidence: >
      CI run 39891554233 artifact `lcd-probe`, flashed at its flash_args offsets
      (0x0 / 0x8000 / 0x10000, hashes verified). Serial: every esp_lcd call
      ESP_OK, then `lcdprobe: pattern drawn` (boot capture returned by the
      bench serial reset at 02:52:01Z; the bench log records the reset but
      not the captured text, and that capture is not committed; the link from
      the 02:51:54Z flash to this artefact rests on timing). Operator prompt answered on the
      bench (activity log 02:58:25Z "Human confirmed"): with USB-C on the
      right, black background, white 2-px frame on all four edges with no
      noise, RED top-left, GREEN top-right, BLUE bottom-left.
    consequence: >
      These settings are confirmed, not just recommended: invert_color(true),
      swap_xy(true), mirror(false, true), set_gap(0, 35), RGB element order,
      and RGB565 bytes swapped (MSB first) in the buffer for the 8-bit bus.
      Since the bus is write-only, ESP_OK from esp_lcd proved nothing by
      itself; the operator answer is the observation.
  operator-at-bench:
    what: A person at the bench answers operator prompts and can see the T-Display-S3 panel, held USB-C to the right
    available: yes
    observed: 2026-10-23
    evidence: the lcd-probe prompt was answered Done on the Pi display (activity log 02:58:25Z), and only someone looking at the panel could answer it
    consequence: >
      The answer counts only when it is given on the Pi display and the bench
      logs "Human confirmed". A first answer given elsewhere never reached the
      bench, and the prompt stayed pending.

