# Test plan — every test, what it verifies, what it needs, what it last produced.
# Owned by /build. Contract: docs/Functionality/TDisplay-S3-Hello-FSD.md
#
# Status values: not done | successful | failed — written by whatever ran the
# test, never by hand, always with the commit. Blocked is computed from
# `needs` against `capabilities`; never typed.

project: tdisplay-s3-hello
fsd: docs/Functionality/TDisplay-S3-Hello-FSD.md
dut:
  board: LilyGO T-Display-S3 (non-touch, 16 MB flash, 8 MB PSRAM)
  chip: esp32s3
  slot: SLOT4
  serial: rfc2217://192.168.2.230:4004
testbench:
  url: http://192.168.2.230:8080
  record:   # dated observation (memory); tests select the bench by identity
    observed: 2026-10-23
    hostname: testbench-0441
    last_seen_ip: 192.168.2.230
    portal_version: not reported (/api/info carries none)
dut_record:   # the unit this project is verified against (observed 2026-10-23, /api/chip/info SLOT4)
  chip: ESP32-S3 (QFN56)
  revision: v0.1
  psram: embedded 8MB (AP_3v3)
  flash: 16MB (manufacturer 0xef, device 0x4018), quad
  mac: 34:85:18:71:c7:34
  usb: USB-Serial/JTAG 303a:1001, /dev/ttyACM0

# ── Capabilities ─────────────────────────────────────────────────────────
# Bench capabilities: `yes` as the bench declares them (Harness FSD); a
# project never proves the bench. Project-side equipment: `unproven` until
# /commission observes it working here — each one is a debugging-agenda item.
capabilities:
  bench-flash:
    what: Flash an image set to SLOT4 over USB (Harness /api/flash)
    available: yes
  bench-serial-monitor:
    what: Read SLOT4 serial with pattern wait, DTR/RTS held low (Harness serial monitor)
    available: yes
    # Usage note carried from esp32-oled-hello: a `^`-anchored pattern did not
    # match lines the monitor itself returned; use unanchored patterns.
  bench-usb-reset:
    what: Reset the DUT in SLOT4 over USB-Serial/JTAG (Harness serial reset)
    available: yes
  bench-operator-prompt:
    what: Blocking operator prompt with yes/no answer and timestamp (Harness human interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the bench web UI
    available: yes
  bench-wifi-scan:
    what: WiFi scan from the bench radio (for FR-9.1 air check)
    available: yes
  bench-ble-scan:
    what: BLE scan from the bench (for FR-9.1 air check)
    available: yes
  slot4-gpio-reset:
    what: EN/BOOT reset and download mode via bench GPIO on SLOT4
    available: no
    # Bench reports gpio_wired=false for SLOT4 (EN pulse produced no reset).
    # Consequence: no GPIO recovery of a crash-looping or wedged DUT; recovery
    # is USB reset, or an operator holding BOOT (GPIO 0) while replugging USB-C.
  release-verification:
    what: Tag-triggered journey run against the released artifact
    available: yes
    # The devcontainer runs 24/7; the bench may not. An absent bench at
    # verify time is an unmet precondition (not done), never a failure.
  dut-tdisplay-s3-slot4:
    what: The board in SLOT4 is a T-Display-S3 with 16 MB flash; a CI-built image flashes over USB and its log reaches SLOT4's monitor
    available: yes
    observed: 2026-10-23
    evidence: >
      /api/chip/info SLOT4: ESP32-S3 (QFN56) v0.1, 8MB embedded PSRAM, flash
      0xef/0x4018 detected 16MB, MAC 34:85:18:71:c7:34 (matches FSD §2.2 / C-10.3).
      CI run 39891554233 (Commissioning aids, commit of commissioning/) artifact
      `forward-path`, flashed via /api/flash at its flash_args offsets 0x0
      bootloader, 0x8000 partition table, 0x10000 app (3 hashes verified);
      serial monitor matched `OFF` in the ON/OFF stream at 02:51:43Z.
      Board identity as a T-Display-S3 (not only an ESP32-S3) is shown by
      `lcd-st7789`: its built-in panel answers on the T-Display-S3 pin map.
  lcd-st7789:
    what: The built-in ST7789 lights correctly with the FSD §2.2 pin map, GPIO 15 power, GPIO 38 backlight, 10 MHz i80 clock and offset 35
    available: yes
    observed: 2026-10-23
    evidence: >
      CI run 39891554233 artifact `lcd-probe`, flashed at its flash_args offsets
      (0x0 / 0x8000 / 0x10000, hashes verified). Serial: every esp_lcd call
      ESP_OK, then `lcdprobe: pattern drawn`. Operator prompt answered on the
      bench (activity log 02:58:25Z "Human confirmed"): with USB-C on the
      right, black background, white 2-px frame on all four edges with no
      noise, RED top-left, GREEN top-right, BLUE bottom-left.
    consequence: >
      These settings are confirmed, not just recommended: invert_color(true),
      swap_xy(true), mirror(false, true), set_gap(0, 35), RGB element order,
      and RGB565 bytes swapped (MSB first) in the buffer for the 8-bit bus.
      Since the bus is write-only, ESP_OK from esp_lcd proved nothing by
      itself; the operator answer is the observation.
  operator-at-bench:
    what: A person at the bench answers operator prompts and can see the T-Display-S3 panel, held USB-C to the right
    available: yes
    observed: 2026-10-23
    evidence: the lcd-probe prompt was answered Done on the Pi display (activity log 02:58:25Z), and only someone looking at the panel could answer it
    consequence: >
      The answer counts only when it is given on the Pi display and the bench
      logs "Human confirmed". A first answer given elsewhere never reached the
      bench, and the prompt stayed pending.

# ── Gate verdicts ────────────────────────────────────────────────────────
gates:
  - {gate: ai-harnessed, verdict: OPEN, date: 2026-10-23, commit: 034f086, checker: fresh, round: 1}

# ── Tests ────────────────────────────────────────────────────────────────
# JRN-01 is the standard run (workflow shape: ordered, one test per step).
# It is the gate every hardware session runs behind. Steps 3, 4 and 6 need
# FSD Phase 2 firmware; against Phase 1 firmware the journey stops at step 3.
tests:
  - id: JRN-01.1
    title: Flash the firmware to SLOT4 over USB
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 1
    tier: bench
    verifies: [C-10.5]
    needs: [bench-flash, dut-tdisplay-s3-slot4]
    observable: flash reports success for every image in flash_args
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: JRN-01.2
    title: USB reset reaches the boot marker
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 1
    tier: bench
    verifies: [FR-7.6, C-10.5]
    needs: [bench-usb-reset, bench-serial-monitor, dut-tdisplay-s3-slot4]
    observable: "`Init complete, running event-driven` exactly once on SLOT4 serial"
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: JRN-01.3
    title: Display comes up within the boot deadline
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.2, FR-7.1]
    needs: [bench-usb-reset, bench-serial-monitor, dut-tdisplay-s3-slot4, lcd-st7789]
    observable: "`hello: shown line1=\"Hello, world!\"` within 3.0 s of the reset command"
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: JRN-01.4
    title: Operator sees the greeting upright, white on black
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.1, FR-6.1, FR-6.3]
    needs: [bench-operator-prompt, operator-at-bench, dut-tdisplay-s3-slot4, lcd-st7789]
    observable: operator confirms `Hello, world!` on the top line, upright with USB-C on the right, white on black
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: JRN-01.5
    title: Uptime ticks once per second
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 1
    tier: bench
    verifies: [FR-5.4, FR-5.5, FR-7.3]
    needs: [bench-serial-monitor, dut-tdisplay-s3-slot4]
    observable: "`hello: up=<N>`, N +1 per line, gaps 900–1100 ms over 10 lines"
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: JRN-01.6
    title: Operator sees the uptime line match the log
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.3]
    needs: [bench-operator-prompt, operator-at-bench, bench-serial-monitor, dut-tdisplay-s3-slot4, lcd-st7789]
    observable: operator confirms line 2 reads `Up: <N> s`, N within ±1 of the latest log line
    impl: ""
    result: {status: not done, reason: test not written, commit: null}

  - id: TC-TIER-01
    title: Host tier runs (C compiler and pytest available)
    shape: atomic
    kind: standard
    wave: 1
    tier: host
    verifies: []
    # Infrastructure check: proves the tier exists, verifies no requirement.
    needs: []
    impl: tests/host/test_tier.py::test_host_c_compiler_builds_and_runs
    result: {status: not done, reason: never run, commit: null}
