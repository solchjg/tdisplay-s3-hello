name: host tests + lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pytest==8.*' 'ruff==0.16.1'
      - run: ruff check .
      - run: pytest tests/host -q

  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .devcontainer -t tdisplay-hello-dev
      - name: Toolchain is ESP-IDF v6.0.2
        run: docker run --rm tdisplay-hello-dev idf.py --version | tee /dev/stderr | grep -q 'v6.0.2'
      - name: TestbenchDriver importable
        run: docker run --rm --entrypoint python tdisplay-hello-dev -c "import testbench_driver"
      - name: Runner installed
        run: docker run --rm -u runner --entrypoint /opt/actions-runner/config.sh tdisplay-hello-dev --version
